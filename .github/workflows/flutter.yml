name: Flutter checks
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      # Ephemeral CI identity only; these artifacts are never production releases.
      - name: Configure disposable CI signing
        shell: bash
        run: |
          ci_password="$(openssl rand -hex 32)"
          echo "::add-mask::$ci_password"
          export CI_SIGNING_PASSWORD="$ci_password"
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ci-validation.jks" -storetype JKS -alias ci-validation -keyalg RSA -keysize 2048 -validity 2 -dname "CN=CI Validation" -storepass:env CI_SIGNING_PASSWORD -keypass:env CI_SIGNING_PASSWORD
          echo "DILIGENT_SIGNING_STORE_FILE=$RUNNER_TEMP/ci-validation.jks" >> "$GITHUB_ENV"
          echo "DILIGENT_SIGNING_STORE_PASSWORD=$ci_password" >> "$GITHUB_ENV"
          echo "DILIGENT_SIGNING_KEY_ALIAS=ci-validation" >> "$GITHUB_ENV"
          echo "DILIGENT_SIGNING_KEY_PASSWORD=$ci_password" >> "$GITHUB_ENV"
      - run: flutter build apk --release
      - run: flutter build appbundle --release
